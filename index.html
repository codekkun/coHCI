<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果忍者 Web 版</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Fruit Ninja</p>
                <h1>水果忍者 Web 版</h1>
            </div>
            <div class="status-group">
                <span id="cameraStatus" class="status-pill">正在等待摄像头</span>
            </div>
        </header>

        <main class="game-shell">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="gameCanvas" width="900" height="600"></canvas>

            <section class="hud-card">
                <div>
                    <p class="hud-label">操作</p>
                    <p>开局先自然挥动完成短校准，随后挥动手指切水果；携带对应道具后，响指可时停，五指张开可清屏。</p>
                </div>
                <div>
                    <p class="hud-label">自适应</p>
                    <p>每局使用固定灵敏度；结算后根据轨迹覆盖、疲劳趋势和命中率生成下一局灵敏度，并与上一局对比。</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/meidapipe.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
