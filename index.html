<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果忍者 Web 版</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Fruit Ninja</p>
                <h1>水果忍者 Web 版</h1>
            </div>
            <div class="status-group">
                <span id="cameraStatus" class="status-pill">正在等待摄像头</span>
            </div>
        </header>

        <main class="game-shell">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="gameCanvas" width="900" height="600"></canvas>

            <section class="hud-card">
                <div>
                    <p class="hud-label">操作</p>
                    <p>挥动手指切水果；没有摄像头时可直接用鼠标拖动。</p>
                </div>
                <div>
                    <p class="hud-label">模式</p>
                    <p>经典模式有生命值，禅意模式倒计时，街机模式切炸弹不死亡。</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/meidapipe.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
